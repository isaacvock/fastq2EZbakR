name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches_ignore: []

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout with submodules
      uses: actions/checkout@v3
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Formatting
      uses: github/super-linter@v5
      env:
        VALIDATE_ALL_CODEBASE: false
        DEFAULT_BRANCH: featurecount
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VALIDATE_SNAKEMAKE_SNAKEFMT: true
  linting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Linting
      uses: snakemake/snakemake-github-action@v1.25.1
      with:
        directory: .test
        snakefile: workflow/Snakefile
        args: "--configfile .test/configs/transcript_config.yaml --lint"

  run-workflow:
    runs-on: ubuntu-latest
    needs:
      - linting
      - formatting
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    - name: Test workflow (alt-output)
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: workflow/Snakefile
        args: "--configfile .test/configs/altoutput_config.yaml --use-conda --show-failed-logs --cores 2 --set-threads maketdf=1 --conda-cleanup-pkgs cache --latency-wait 30"
    - name: Test workflow (transcripts no fastp)
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: workflow/Snakefile
        args: "--configfile .test/configs/transcript_nofastp.yaml --use-conda --show-failed-logs --cores 2 --set-threads maketdf=1 --conda-cleanup-pkgs cache --latency-wait 30"
    - name: Test workflow (mutpos)
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: workflow/Snakefile
        args: "--configfile .test/configs/mutpos_config.yaml --use-conda --show-failed-logs --cores 2 --set-threads maketdf=1 --conda-cleanup-pkgs cache --latency-wait 30"
    - name: Test workflow (transcripts)
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: workflow/Snakefile
        args: "--configfile .test/configs/transcript_config.yaml --use-conda --show-failed-logs --cores 2 --set-threads maketdf=1 --conda-cleanup-pkgs cache --latency-wait 30"
    - name: Test workflow (bam2EZbakR)
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: workflow/Snakefile
        args: "--configfile .test/configs/bam2bakR_config.yaml --use-conda --show-failed-logs --cores 2 --set-threads maketdf=1 --conda-cleanup-pkgs cache --latency-wait 30"
    - name: Test workflow (hisat2)
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: workflow/Snakefile
        args: "--configfile .test/configs/hisat2_config.yaml --use-conda --show-failed-logs --cores 2 --set-threads maketdf=1 --conda-cleanup-pkgs cache --latency-wait 30"
    - name: Clean up
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: workflow/Snakefile
        args: "--configfile .test/configs/transcript_nofastp.yaml --use-conda --show-failed-logs --cores 2 --set-threads maketdf=1 --conda-cleanup-pkgs cache --delete-all-output --latency-wait 30"

  run-workflow-3p:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        call_threeputrs: ["True", "False"]
    needs:
      - linting
      - formatting
      - run-workflow
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    - name: Check DAG (3pUTR disabled)
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: workflow/Snakefile
        args: "--configfile .test/configs/transcript_config.yaml --dry-run --cores 2"
    - name: Check DAG (3pUTR calling ${{ matrix.call_threeputrs }})
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: workflow/Snakefile
        args: "--configfile .test/configs/threeputr_config.yaml --config call_threeputrs=${{ matrix.call_threeputrs }} --dry-run --cores 2"
    - name: Test annotation helper
      if: matrix.call_threeputrs == 'False'
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: .test/threeputr_tests.smk
        args: "test_annotate_threepUTR_gtf --use-conda --show-failed-logs --cores 1"
    - name: Test de novo calling fixtures
      if: matrix.call_threeputrs == 'True'
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: .test/threeputr_tests.smk
        args: "test_make_threepUTR_gtf --use-conda --show-failed-logs --cores 1"
    - name: Test clustering and weighted support fixtures
      if: matrix.call_threeputrs == 'True'
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: .test/threeputr_cluster_tests.smk
        args: "--use-conda --show-failed-logs --cores 1"
    - name: Test clustering distance override
      if: matrix.call_threeputrs == 'True'
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: .test/threeputr_cluster_tests.smk
        args: "--config bedtools_cluster_distance=20 --use-conda --show-failed-logs --cores 1 --forceall"
    - name: Test workflow (3pUTR calling ${{ matrix.call_threeputrs }})
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: workflow/Snakefile
        args: "--configfile .test/configs/threeputr_config.yaml --config call_threeputrs=${{ matrix.call_threeputrs }} --use-conda --show-failed-logs --cores 2 --set-threads maketdf=1 --conda-cleanup-pkgs cache --latency-wait 30 --notemp"
    - name: Check annotation-only assignments and cB
      if: matrix.call_threeputrs == 'False'
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: .test/threeputr_tests.smk
        args: "check_threeputr_output --use-conda --show-failed-logs --cores 1"

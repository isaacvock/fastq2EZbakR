name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches_ignore: []

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout with submodules
      uses: actions/checkout@v3
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Formatting
      uses: github/super-linter@v5
      env:
        VALIDATE_ALL_CODEBASE: false
        DEFAULT_BRANCH: featurecount
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VALIDATE_SNAKEMAKE_SNAKEFMT: true
  linting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Linting
      uses: snakemake/snakemake-github-action@v1.25.1
      with:
        directory: .test
        snakefile: workflow/Snakefile
        args: "--configfile .test/configs/transcript_config.yaml --lint"

  run-workflow:
    runs-on: ubuntu-latest
    needs:
      - linting
      - formatting
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    - name: Test flatten annotation helper
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: .test/flatten_tests.smk
        args: "test_flatten_annotation --use-conda --show-failed-logs --cores 1"
    - name: Test SNP sample selection helper
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: .test/snp_tests.smk
        args: "test_snp_sample_selection --use-conda --show-failed-logs --cores 2"
    - name: Test workflow output validator
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: .test/workflow_tests.smk
        args: "test_workflow_validator --use-conda --show-failed-logs --cores 1"
    - name: Test workflow (legacy transcripts config)
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: workflow/Snakefile
        args: "--configfile .test/configs/transcript_config.yaml --use-conda --show-failed-logs --cores 2 --set-threads maketdf=1 --conda-cleanup-pkgs cache --latency-wait 30"
    - name: Validate & clean (legacy transcripts)
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: .test/workflow_tests.smk
        args: "validate_and_clean --config target_config=configs/transcript_config.yaml clean_indices=False --use-conda --show-failed-logs --cores 1 --forceall"
    - name: Test workflow (STAR + RSEM + skip_trimming)
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: workflow/Snakefile
        args: "--configfile .test/configs/star_rsem_config.yaml --use-conda --show-failed-logs --cores 2 --set-threads maketdf=1 --conda-cleanup-pkgs cache --latency-wait 30"
    - name: Validate & clean (STAR + RSEM)
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: .test/workflow_tests.smk
        args: "validate_and_clean --config target_config=configs/star_rsem_config.yaml clean_indices=True --use-conda --show-failed-logs --cores 1 --forceall"
    - name: Test workflow (HISAT-3N + genome TEC + no-ctl depth SNPs)
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: workflow/Snakefile
        args: "--configfile .test/configs/hisat3n_config.yaml --use-conda --show-failed-logs --cores 2 --set-threads maketdf=1 --conda-cleanup-pkgs cache --latency-wait 30"
    - name: Validate & clean (HISAT-3N)
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: .test/workflow_tests.smk
        args: "validate_and_clean --config target_config=configs/hisat3n_config.yaml clean_indices=True --use-conda --show-failed-logs --cores 1 --forceall"
    - name: Test workflow (bam2EZbakR + cUP/arrow without cB)
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: workflow/Snakefile
        args: "--configfile .test/configs/bam2bakr_config.yaml --use-conda --show-failed-logs --cores 2 --set-threads maketdf=1 --conda-cleanup-pkgs cache --latency-wait 30"
    - name: Validate & clean (bam2EZbakR)
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: .test/workflow_tests.smk
        args: "validate_and_clean --config target_config=configs/bam2bakr_config.yaml clean_indices=False --use-conda --show-failed-logs --cores 1 --forceall"
    - name: Test workflow (HISAT2 + mutpos + no-ctl random SNPs)
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: workflow/Snakefile
        args: "--configfile .test/configs/hisat2_mutpos_config.yaml --use-conda --show-failed-logs --cores 2 --set-threads maketdf=1 --conda-cleanup-pkgs cache --latency-wait 30"
    - name: Validate & clean (HISAT2 + mutpos)
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: .test/workflow_tests.smk
        args: "validate_and_clean --config target_config=configs/hisat2_mutpos_config.yaml clean_indices=True --use-conda --show-failed-logs --cores 1 --forceall"

  run-workflow-3p:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        call_threeputrs: ["True", "False"]
    needs:
      - linting
      - formatting
      - run-workflow
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    - name: Check DAG (3pUTR disabled)
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: workflow/Snakefile
        args: "--configfile .test/configs/transcript_config.yaml --dry-run --cores 2"
    - name: Check DAG (3pUTR calling ${{ matrix.call_threeputrs }})
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: workflow/Snakefile
        args: "--configfile .test/configs/threeputr_config.yaml --config call_threeputrs=${{ matrix.call_threeputrs }} --dry-run --cores 2"
    - name: Test annotation helper
      if: matrix.call_threeputrs == 'False'
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: .test/threeputr_tests.smk
        args: "test_annotate_threepUTR_gtf --use-conda --show-failed-logs --cores 1"
    - name: Test de novo calling fixtures
      if: matrix.call_threeputrs == 'True'
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: .test/threeputr_tests.smk
        args: "test_make_threepUTR_gtf --use-conda --show-failed-logs --cores 1"
    - name: Test clustering and weighted support fixtures
      if: matrix.call_threeputrs == 'True'
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: .test/threeputr_cluster_tests.smk
        args: "--use-conda --show-failed-logs --cores 1"
    - name: Test clustering distance override
      if: matrix.call_threeputrs == 'True'
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: .test/threeputr_cluster_tests.smk
        args: "--config bedtools_cluster_distance=20 --use-conda --show-failed-logs --cores 1 --forceall"
    - name: Test workflow (3pUTR calling ${{ matrix.call_threeputrs }})
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: workflow/Snakefile
        args: "--configfile .test/configs/threeputr_config.yaml --config call_threeputrs=${{ matrix.call_threeputrs }} --use-conda --show-failed-logs --cores 2 --set-threads maketdf=1 --conda-cleanup-pkgs cache --latency-wait 30 --notemp"
    - name: Check annotation-only assignments and cB
      if: matrix.call_threeputrs == 'False'
      uses: ezherman/snakemake-github-action@b6bd319468ad9a049d37058554ebcd52eca38c92
      with:
        directory: .test
        snakefile: .test/threeputr_tests.smk
        args: "check_threeputr_output --use-conda --show-failed-logs --cores 1"

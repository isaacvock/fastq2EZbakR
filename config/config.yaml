####### GENERAL INFORMATION ABOUT THIS CONFIG #######
#
# This config file allows you to specify a number of important pieces of information that
# the fastq2EZbakR pipeline will require to run. It also allows you to set optional parameters
# for all tools that fastq2EZbakR makes use of.
#
# File paths can either be absolute (e.g., ~/path/to/file/or/directory) or relative
# to the directory in which you are calling the pipeline from (e.g., data/fastq/WT_1 in the
# example samples entry means to look in the data directory present in the directory
# where you called `snakemake` to run the pipeline).
#
####### PARAMETERS YOU NEED TO SET #######


# Download fastq files from SRA? If True, you don't need to specify paths to fastq files under samples.
# In fact, samples will go completely unused in this case
# NOTE: check if the fastq files you are downloading are all
# paired end or single end, and make sure to set PE accordingly
# below.
download_fastqs: False

# List of SRA accession codes to download fastq files from
# Only relevant if download_fastqs is True
sra_accessions: ["SRR24994162", "SRR24994161"]


# Providing bam files?
# NOTE: fastq2EZbakR automatically detects BAM mode when download_fastqs is False
# and every path under `samples` ends with `.bam` (skipping trimming, alignment, etc.).
bam2bakr: False

## Paths to data to process
# path to directory containing fastq files if bam2bakr is False
  # fastq files can be either gzipped or unzipped
  # Each set of fastq files must be in a different directory
# path to individual bam files if bam2bakr is True
samples:
    WT_1: data/fastq/WT_1
    WT_2: data/fastq/WT_2
    WT_ctl: data/fastq/WT_ctl
    KO_1: data/fastq/KO_1
    KO_2: data/fastq/KO_2
    KO_ctl: data/fastq/KO_ctl

## example of what samples will look like for bam file input
# samples:
#   WT_1: data/bams/WT_1.bam
#   WT_2: data/bams/WT_2.bam
#   WT_ctl: data/bams/WT_ctl.bam
#   KO_1: data/bams/KO_1.bam
#   KO_2: data/bams/KO_2.bam
#   KO_ctl: data/bams/KO_ctl.bam


# -s4U control sample IDs
control_samples: ['WT_ctl', 'KO_ctl']

# Paired end?
  # Set to True or False, no double quotes
PE: True

# Path to genome fasta file
genome: data/genome/genome.fasta


# Path to annotation gtf file
annotation: data/annotation/genome.gtf


# Which aligner to use?
  # Options are:
    # 1) star
    # 2) hisat2
    # 3) hisat3n (or "hisat-3n"; 3-nucleotide conversion-aware aligner; does not run RSEM)
aligner: "star"


# Path to directory containing indices
  # Indices will be built automatically if not present
  # I would suggest naming this "aligner"_index, though any
  # directory path name will do (avoid results/...; the
  # results/ directory is where the pipeline output will be created,
  # so probably better to avoid specifying a path there that might
  # clash with the names of one of the other automatically created
  # directories).
  # If you aren't providing this, directory must not exist at the time
  # you launch the pipeline with `snakemake ...`, or else Snakemake won't
  # know to create it.
indices: data/indices/star_index


# Strandedness
  # set to "reverse", "yes", or "no"
  # Instead of "yes", can now use "forward" as well (both will have the same result)
  # reverse means that read 2 represents 5' to 3' sequence of original RNA (read 1 thus represents its reverse complement)
  # yes means that read 1 represents 5' to 3' sequence of original RNA
  # no means unstranded
  # Used by featureCounts, RSEM, HISAT2/HISAT-3N, mutation calling, and TEC assignment
strandedness: "reverse"


# Features to assign reads to
  # genes = anywhere in an annotated gene body
  # exons = in exclusively exonic regions of a gene
  # tec = strand- and splice-compatible set of transcripts with which read overlaps;
    # TEC = transcript equivalence class (works with STAR, HISAT-3N, HISAT2, and BAM input)
  # exonic_bins = exonic regions as defined in DEXSeq paper (Anders et al., 2012)
  # junctions = spliced exon-exon junctions (uses STAR jI/jM tags when present,
    # or exact CIGAR-N intron coordinates for HISAT-3N, HISAT2, and external BAMs)
  # threeputr = 3'-UTRs. Should only be used with 3'-end sequencing data.
    # This option is paired with `call_threeputrs` which determines whether or not
    # 3' UTRs are called de novo using your data or annotated from your provided GTF
  # eej = exon-exon junctions via synthetic GTF + featureCounts
  # eij = exon-intron junctions via synthetic GTF + featureCounts
features:
    genes: True
    exons: True
    tec: False
    exonic_bins: False
    junctions: False
    threeputr: False
    eej: False
    eij: False



####### PARAMETERS THAT TUNE ASPECTS OF PIPELINE BEHAVIOR, BUT WITH LIKELY REASONABLE DEFAULTS #######


### Transcript Equivalence Class (TEC) assignment mode (only relevant if features.tec == True)
  # "auto": uses strand-filtered STAR/RSEM transcriptome BAM when aligner == "star" and bam2bakr == False;
  #         automatically uses annotation-based genome-BAM TEC assignment for hisat3n, hisat2, or bam2bakr == True.
  # "transcriptome": force STAR/RSEM transcriptome BAM TEC assignment (requires aligner == "star" and FASTQ input)
  # "genome": force aligner-agnostic genome-BAM TEC assignment against `annotation`
tec_mode: "auto"

# Permitted overhang (bp) at annotated transcript 5' and 3' ends in genome TEC mode
# (internal splice sites always enforce 0 bp overhang)
tec_end_overhang: 2


### Parameters that are only relevant if threeputr == True

# If call_threeputrs == True, then 3'-ends are called de novo using your 3'-end sequencing data
# If call_threeputrs == False, an augmented copy of `annotation` is created automatically.
  # Each transcript's terminal exon becomes a 3UTR assignment region with its own utr_id,
  # including transcripts without CDS annotations. These are not strictly noncoding UTRs.
  # Existing custom 3UTR records are reused instead; missing utr_id values are filled in.
call_threeputrs: False

# Only relevant if call_threeputrs == True
# If only_annotated_threeputrs == True, then de novo identified 3' UTRs that don't overlap with annotated
# 3'-ends will be filtered out
only_annotated_threeputrs: True

# Only relevant if call_threeputrs == True
# Flag a run of this many As in the 25 bases downstream of cleavage, or >=7 As
# in the first 10 downstream bases, in transcript orientation (possible internal priming).
# Annotated sites are flagged but retained, including in annotated-only runs.
# Suspicious unannotated sites are filtered. <=0 disables both criteria;
# the exported false_polyA_ attribute is NA when assessment is disabled.
false_polyA_len: 7

# Only relevant if call_threeputrs == True and only_annotated_threeputrs == False
# Filter out de novo called 3'-UTRs not near AATAAA or ATTAAA in transcript orientation
# Annotated 3' UTRs will always be kept
require_CPA_site: False

# Minimum coverage in a cluster of 3'-ends for it to make it to the annotation
# = total number of reads across all samples
# If you don't uncomment this parameter, default is 20 * number of samples
# cluster_coverage: 100

# Minimum fractional usage (# of reads / sum(# of reads for all clusters in gene) )
# of a cluster for it to make it to the annotation
cluster_fxn: 0.0

# Length by which to extend either end of genes when finding genes that a cluster overlaps with
extension: 0

# How many reads does a 3'UTR need in at least one sample to make it to the final annotation
coverage_cutoff: 25

# -d parameter of bedtools cluster: maximum gap between neighboring intervals.
# Chaining can produce clusters wider than this distance.
bedtools_cluster_distance: 100


### Deeptools bamCoverage parameters
deeptools_params: ""


### What final output do you want pipeline to create?
  # cB = standard cB file tracking number of mutations and number of mutable reference nucleotides in each read.
  # cUP = remove the mutable reference nucleotide count and instead compute the average of this value for reads
  #         with the same mutational content. This is orders of magnitude more compressed than a cB file (typically
  #         around 100x smaller), and is still compatible with EZbakR. Downside is the slight information loss that
  #         this compression leads to.
  # arrow = Partitioned database of parquet files, in the format necessary to pass to EZbakR.
  #
  # At least one of these should be set to True.
final_output:
  cB: True
  cUP: False
  arrow: True


### Types of mutations to make tracks for otherwise
  # Comma separated string of mutation type
  # Examples:
    # "TC"
      # counts T-to-C mutations
    # "TC,GA"
      # counts T-to-C and G-to-A mutations
mut_tracks: "TC"


### How much memory can the merge features and muts step use?
max_merge_mem: "8G"


### Track normalization parameters

# Normalize sequencing tracks?
normalize: True

# String common to spike-in gene_ids in annotation gtf
  # If you have no spike-ins, then this should be "\"\"", i.e., an empty string ("")
  # Used for normalization of tracks. Thus, only relevant if normalize == True
spikename: "\"\""

# Only use exonic reads for normalization? If not, then all reads mapping to annotated genes will be used
use_exons_only: True


### Miscellaneous parameters

# Skip adapter trimming?
  # If True, will skip fastp step.
  # NOTE: Mutation calling intentionally does NOT mask mutations near read ends (minDist),
  # because masking mutations without masking reference bases deflates mutation rates.
  # Instead, rely on upstream trimming (fastp) to remove adapters, low-quality tails,
  # or biased read-end cycles (e.g., via `--trim_front1` / `--trim_tail1` in fastp_parameters).
skip_trimming: False


# Path to flattened annotation
  # Will be created if not already present
  # Only relevant if assigning reads to exonic_bins
flat_annotation: "data/annotation/flat.gtf"


# Minimum base quality required to call a mutation
# NOTE: due to a legacy ASCII parsing quirk, the actual Phred score
# minimum is `minqual` - 33 (non-inclusive; i.e., Phred >= `minqual` - 32).
# So if you set `minqual: 62`, the minimum Phred score allowed for counting a base call
# as a mutation (and for mpileup anomaly calling) is 30.
minqual: 62


# Are you using the Windows subsystem for Linux?
  # Due to a bug in STAR/GNU parallel, tracks have to be created iteratively if this is the case
WSL: False


# Track site-specific mutational content?
mutpos: False


# Make colored sequencing tracks?
make_tracks: True


# Use RSEM to quantify transcript isoform abundances?
  # Only relevant if aligner = 'star' and fastq files are
  # provided as input
run_rsem: True



####### OPTIONAL PARAMETERS FOR THE VARIOUS TOOLS AND SCRIPTS USED #######

##### FEATURECOUNTS PARAMETERS #####
# Parameters automatically specified:
  # Genes: -R CORE -g gene_id -t transcript
  # Exons: -R CORE -g gene_id -J
  # Transcripts: -R CORE -g transcript_id -t exon -O
  # Exonbins: -R CORE -f -g exon_id -t exonic_part -O
# If PE = True, then "-p --countReadPairs" is also automatically set
#
# !!DO NOT REDUNDANTLY SPECIFY AUTOMATICALLY SPECIFIED PARAMETERS!!
# Defaults suggested:
# 1) Set -M for multi-feature overlap cases. Non-primary multi-mapping reads are filtered
# prior to running featureCounts, so we want to count all reads.
# 2) Set --nonOverlap to 0 for exon assignment. This ensures that reads overlapping any
# non-exonic region are unassigned to the exonic feature (XF).
# Soft-clipping counts as non-assignment, so it is best to turn off soft-clipping in your
# aligner (done in the defaults for STAR, HISAT2, and HISAT-3N below) or increase nonOverlap.

# Parameters for assignment of reads to genes
fc_genes_extra: "--nonOverlap 0"

# Parameters for assignment of reads to exons
fc_exons_extra: "--nonOverlap 0"

# Parameters for assignment of reads to transcripts
fc_transcripts_extra: "-M"

# Parameters for assignment of reads to exonbins
fc_exonbins_extra: "-M"

# Parameters for assignment of reads to exon-exon junctions
fc_eej_extra: "-M"

# Parameters for assignment of reads to exon-intron junctions
fc_eij_extra: "-M"


##### FASTP PARAMETERS #####
  # See https://github.com/OpenGene/fastp for details

# Adapters to pass to fastp
  # Not strictly necessary as fastp can autodetect adapters. Autodetection is more accurate for paired-end data though.
  # For paired-end data with widely used Illumina TruSeq adapters, this could be:
  # "--adapter_sequence AGATCGGAAGAGCACACGTCTGAACTCCAGTCA --adapter_sequence_r2 AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT"
fastp_adapters: ""


# Optional parameters to set for fastp
fastp_parameters: ""


##### FASTQC PARAMETERS #####
  # See https://www.bioinformatics.babraham.ac.uk/projects/fastqc/ for details

# Optional parameters to set for fastqc
fastqc_params: ""



##### STAR PARAMETERS #####

# Optional parameters to set for star index
  # --sjdbGTFfile is automatically set to be the provided annotation file
star_index_params: ""


# SAM tags to add to alignment
star_sam_tags: ["NH", "HI", "AS", "NM", "MD", "nM"]


# Optional parameters to set for star align
  # --sjdbGTFfile is automatically set to be the provided annotation file
  # --outSAMattributes will also be set and provided the tags specified in `star_sam_tags`, merged with whatever is set here
  # Finally, --outSAMtype will be force set to BAM Unsorted (as sort_filter immediately queryname-sorts alignments)
  # We suggest turning off soft-clipping to improve assignment of reads to exons
star_align_params: "--alignEndsType EndToEnd --outFilterType BySJout --outFilterMismatchNmax 20 --outFilterScoreMinOverLread 0.4 --outFilterMatchNminOverLread 0.4"



##### MUTATIONAL ANOMALY / SNP CALLING PARAMETERS #####
  # Lightweight parallel `samtools mpileup` + exact binomial & allele-frequency anomaly caller.
  # Flagged sites are excluded from BOTH mutation counts and reference nucleotide denominators.

# Standard cutoffs when -s4U `control_samples` are provided (evaluated both per-control and pooled):
snp_min_depth: 5
snp_min_alt: 3
snp_min_freq: 0.25
snp_err_rate: 0.002
snp_p_cutoff: 1.0e-4

# Opt-in fallback when `control_samples: []` (no -s4U controls available):
  # If True, pools all +s4U samples with conservative depth, frequency, and null-rate cutoffs
  # so true heterozygous/homozygous SNPs and RNA-editing sites are masked without censoring
  # heavily labeled nascent RNA reads.
call_snps_without_ctl: False
snp_noctl_min_depth: 20
snp_noctl_min_freq: 0.35
snp_noctl_err_rate: 0.10

# Optional extra arguments passed directly to `samtools mpileup`
snp_mpileup_params: ""



##### HISAT2 PARAMETERS #####

# Optional parameters to set for hisat2 indexing
hisat2_index_params: ""


# Optional parameters to set for hisat2 alignment
  # NOTE: --rna-strandness is automatically set based on required strandedness parameter
    # DON'T REDUNDANTLY SPECIFY --rna-strandness HERE!!
  # We suggest turning off soft-clipping to improve assignment of reads to exons
hisat2_align_params: "--no-softclip"


# Index base name. If not specified, defaults to "hisat2_index"
hisat2_index_base: ""



##### HISAT-3N PARAMETERS #####
  # Only relevant if aligner == "hisat3n" (or "hisat-3n").
  # NOTE: RSEM is not run when aligner == "hisat3n"; `features.tec` and `features.junctions`
  # remain fully supported via genome-BAM TEC assignment and CIGAR-N junction extraction.

# Optional parameters to set for `hisat-3n-build`
hisat3n_index_params: ""

# Build a repeat index (`--repeat-index`) during `hisat-3n-build`?
  # WARNING: `--repeat-index` can require 64-128+ GB RAM on mammalian genomes, whereas
  # the standard 3N index (False) uses ~8-16 GB RAM.
hisat3n_repeat_index: False

# Base conversion passed to `--base-change <from,to>` in `hisat-3n-build` and `hisat-3n`.
  # If left empty (""), automatically derived from the first entry of `mut_tracks`
  # (e.g., mut_tracks: "TC" -> "T,C").
hisat3n_base_change: ""

# Automatically enable `--directional-mapping` / `--directional-mapping-reverse` when strandedness != "no"?
hisat3n_directional: True

# Optional parameters to set for `hisat-3n` alignment
  # NOTE: --rna-strandness and --directional-mapping* are automatically set from `strandedness`
  # unless overridden here, and `--known-splicesite-infile` is automatically supplied from `annotation`.
hisat3n_align_params: "--no-softclip"

# Index base name inside `indices` directory. If empty, auto-detected or defaults to "hisat3n_index"
hisat3n_index_base: ""



##### RSEM PARAMETERS #####

# Optional parameters to set for RSEM indexing
rsem_index_params: ""


# Optional parameters to set for RSEM quantification
  # NOTE: `--strandedness <reverse|forward|none>` is now automatically passed based on `strandedness`
  # unless `--strandedness` or `--forward-prob` is explicitly specified here.
rsem_quant_params: ""


##### FASTERQDUMP PARAMETERS ######

# Optional parameters to pass to fasterq_dump if download_fastqs == True
fasterq_dump_extras: "--skip-technical"




##### SITE-SPECIFIC MUTATION CALLING PARAMETERS #####

# Minimum coverage for site to make it into filtered cU
min_pos_coverage: 1

# Maximum coverage allowed for site that makes it into filtered cU
max_pos_coverage: 10000000



##### JUNCTION ANNOTATION PARAMETERS #####

# Currently no adjustable parameters for this, but eventually there
# will be.
junction_annotation_params: ""



##### MULTIQC PARAMETERS #####

# Optional parameters to pass to multiQC
multiqc_extra: ""


##############################
##### DEFUNCT PARAMETERS #####
##############################
# These currently do nothing, but might come back in future releases

quantify_premRNA: False
remove_tags: False


